name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test both module formats
        run: |
          node -e "const w=require('warden-auth'); const s=require('warden-auth/server'); if(!w.createWarden||!s.createWardenServer) process.exit(1)"
          node --input-type=module -e "import {createWarden} from 'warden-auth'; import {createWardenServer} from 'warden-auth/server'; if(!createWarden||!createWardenServer) process.exit(1)"
